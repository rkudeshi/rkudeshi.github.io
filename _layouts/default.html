<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>

  <div class="background">


    <header class="masthead">
      <div class="masthead-menu">
        <div class="masthead-menu-item"><a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a></div>
        {% for page in site.pages_list %}
        <div class="masthead-menu-item"><a href="{{ site.baseurl }}{{ page[1] }}">{{ page[0] }}</a></div>
        {% endfor %}
      </div>
      <div class="masthead-fadeout"></div>
    </header>



    <div class="container content">
      <main>
        {{ content }}
      </main>
    </div>



    <footer class="footer">

      <div class="search-box">
      {% include search.html %}
      </div>

      <nav class="footer-social" aria-label="Follow me">
        <span>Follow me:</span>
        {% for s in site.data.social %}<a href="{{ s.url }}" rel="me" title="{{ s.name }}" aria-label="{{ s.name }}"><img src="{{ site.baseurl }}/public/social/{{ s.icon }}.svg" alt="" width="18" height="18"></a>{% endfor %}
      </nav>

      <div class="footer-meta">
        <p>&copy; 2005-{{ site.time | date: '%Y' }}. All rights reserved.</p>
      </div>

      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Color theme"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg><span>Theme: Auto</span></button>

      <div class="jump-to-top">
        <a href="#top" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.75 6 4.25l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>

    </footer>


  </div>

  <script>
  (function () {
    var b = document.getElementById("theme-toggle"), root = document.documentElement;
    var order = ["auto", "dark", "light"], names = { auto: "Auto", dark: "Dark", light: "Light" };
    function current() { return root.getAttribute("data-theme") || "auto"; }
    function show() { b.querySelector("span").textContent = "Theme: " + names[current()]; }
    b.addEventListener("click", function () {
      var next = order[(order.indexOf(current()) + 1) % order.length];
      if (next === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", next);
      try { if (next === "auto") localStorage.removeItem("theme"); else localStorage.setItem("theme", next); } catch (e) {}
      show();
    });
    show();
  })();
  </script>

  {% include analytics.html %}

</body>
</html>
